id: io.github.borgenk.BnkSound
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-nightly
  - org.freedesktop.Sdk.Extension.llvm21
command: bnksound

finish-args:
  - --socket=wayland
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.mpris.MediaPlayer2.*
  # Row labels come off the stream's own application.name, and icons are
  # matched by name against the installed icon themes. The host's own themes
  # need nothing asked for: Flatpak binds /usr/share/icons and the user's to
  # /run/host/share/icons and /run/host/user-share/icons for every app.
  #
  # What it does not bind is what Flatpak itself exports, so an app installed
  # as a Flatpak (which Spotify, Discord and the browsers often are) has its
  # icon only under these two. Read-only, and exported metadata only.
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro

build-options:
  # Building std from source is what the release profile's immediate-abort
  # panics need, and an offline build has only the app's own crates vendored,
  # so the panic strategy drops to plain abort. The target that
  # .cargo/config.toml names comes in on the build command below for the same
  # reason: that file is skipped along with the rest of the checkout's tooling.
  append-path: /usr/lib/sdk/rust-nightly/bin
  env:
    BINDGEN_EXTRA_CLANG_ARGS: -isystem /usr/lib/sdk/llvm21/lib/clang/21/include
    CARGO_HOME: /run/build/bnksound/cargo
    CARGO_PROFILE_RELEASE_PANIC: abort
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib

modules:
  - name: bnksound
    buildsystem: simple
    build-commands:
      - cargo --offline --locked build --release --bin bnksound --target x86_64-unknown-linux-gnu
      - install -Dm755 target/x86_64-unknown-linux-gnu/release/bnksound /app/bin/bnksound
      - install -Dm644 assets/io.github.borgenk.BnkSound.desktop /app/share/applications/io.github.borgenk.BnkSound.desktop
      - install -Dm644 assets/io.github.borgenk.BnkSound.metainfo.xml /app/share/metainfo/io.github.borgenk.BnkSound.metainfo.xml
      - cp -r assets/icons /app/share/
    sources:
      - cargo-sources.json
      - type: dir
        path: .
        skip:
          - .agents
          - .cargo
          - .claude
          - .codex
          - .flatpak-builder
          - .git
          - .github
          - build-dir
          - dist
          - docs-internal
          - flatpak-repo
          - perf
          - target
          - tests
          - ucd
