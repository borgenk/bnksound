# panic = "immediate-abort" on the release profile is still unstable, which is
# what pins this project to nightly.
cargo-features = ["panic-immediate-abort"]

[package]
name = "bnksound"
version = "0.3.6"
edition = "2024"
license = "MIT"
default-run = "bnksound"

[features]
default = []
gtk = ["dep:gtk4", "dep:gdk4-wayland"]

# The tooling in src/dev/, reached through flags on the native binary.
dev = []
# Separate from dev because a global allocator taxes every allocation in the
# process, so only the measuring build carries one.
perf-alloc = ["dev"]

[[bin]]
name = "bnksound"
path = "src/bin/bnksound.rs"

[[bin]]
name = "bnksound-gtk"
path = "src/bin/bnksound-gtk.rs"
required-features = ["gtk"]

[dependencies]
gtk4 = { version = "0.11", optional = true, default-features = false }
gdk4-wayland = { version = "0.11", optional = true, default-features = false }
pipewire = "0.10"
libspa = "0.10"
libspa-sys = "0.10"

# opt-level stays at 3: "s" costs the paint scenarios 13% to 24% and "z" costs
# them 78% to 91%, which the perf gate rejects.
#
# immediate-abort is where most of the size goes: no unwinding, no panic
# formatter, none of std's backtrace symbolizer. A release panic prints nothing.
# Debug builds and the test harness keep unwinding panics.
#
# For symbols: --config profile.release.strip=false --config profile.release.debug=1
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true
