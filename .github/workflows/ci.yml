name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, to catch drift in the Flatpak runtime and the installed packages.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Actions are pinned to a commit, with the version beside it.
jobs:
  # GTK is deliberately not installed here: if the shared code starts reaching
  # for the GTK stack, this job stops building.
  native:
    name: Native (no GTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libspa-sys runs bindgen, which needs libclang. The emoji tests skip
      # themselves unless a colour emoji font is installed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            fonts-noto-color-emoji \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: make fmt-check

      - name: Test the installer and the ABI floor
        run: make test-install test-abi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # The check is the binary's own DT_NEEDED list, not the ldd closure:
      # HarfBuzz is built with GLib support on the usual distributions, so
      # libglib loads behind it whatever bnksound asks for. The closure is
      # printed for the record.
      - name: Assert the binary links no GTK stack
        run: |
          bin=target/x86_64-unknown-linux-gnu/debug/bnksound
          if [ ! -f "$bin" ]; then
            echo "::error::$bin not found, the build layout moved"
            exit 1
          fi
          needed=$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          if echo "$needed" | grep -Ei 'libgtk|libgdk|libglib|libgobject|libgio|libcairo|libpango'; then
            echo "::error::the native binary links part of the GTK stack"
            exit 1
          fi
          ldd "$bin"

  gtk:
    name: GTK shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

  # Nothing else exercises cargo-sources.json: the manifest builds offline and
  # locked, so a dependency added without regenerating it fails here and only
  # here. Regenerate with flatpak-cargo-generator.py against Cargo.lock.
  # Privileged because bwrap needs user namespaces the runner does not grant.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    # Longer than the cargo jobs: SDK extensions download, then an LTO build.
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1fb2df10a57276f90806e1f35454048e30bf1855b7b4ff4808c9ee55887bd852 # gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkSound.yml
          bundle: bnksound.flatpak
          # The manifest skips these two names, so the build cannot fold its
          # own output back into the app. The action's defaults are not.
          build-dir: build-dir
          repo-dir: flatpak-repo
          # The action's only restore-key is the prefix flatpak-builder-<arch>,
          # so a key without it re-downloads all of crates.io every build.
          cache-key: flatpak-builder-${{ github.sha }}

      # The manifest installs bnksound-gtk under the plain name, so only the
      # linkage says which build is inside.
      - name: Verify the app holds the GTK build
        run: |
          if ! grep -aq 'libgtk-4\.so' build-dir/files/bin/bnksound; then
            echo "::error::the Flatpak's bnksound does not link GTK"
            exit 1
          fi

      # The errors this project accepts are in flatpak-lint-exceptions.json,
      # keyed by app id the way the linter reads them. Every other error fails.
      - name: Lint against Flathub's rules
        run: |
          lint() { flatpak-builder-lint --exceptions \
            --user-exceptions .github/flatpak-lint-exceptions.json "$@"; }
          lint manifest io.github.borgenk.BnkSound.yml
          lint repo flatpak-repo
