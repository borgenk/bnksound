name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The toolchain is nightly and floats, so a lint that did not exist yesterday
  # can fail a build nobody touched. Monday morning is a better time to find
  # that than the moment a tag goes out.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # The shipping binary. GTK is deliberately not installed here: if anything in
  # the shared code starts reaching for the GTK stack, this job stops building,
  # which is the whole point of keeping the default feature set empty.
  native:
    name: Native (no GTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pipewire and libspa link against the PipeWire dev packages; libspa-sys
      # runs bindgen at build time, which needs libclang. Text and keyboard
      # handling link freetype, fontconfig, harfbuzz, and xkbcommon directly.
      # The emoji tests skip themselves when no colour emoji font is installed,
      # so fonts-noto-color-emoji is what makes them actually run here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            fonts-noto-color-emoji \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # A GTK-free binary should link no GTK, GDK, GLib, or Pango of its own, so
      # check the artifact rather than trusting the feature flags. The test is
      # the binary's own DT_NEEDED list: those are the libraries bnksound asks
      # for. What those libraries then pull in is theirs to choose, and one of
      # them does pull GLib: HarfBuzz is built with GLib support on the usual
      # distributions, so libglib loads behind it whatever we ask for. Hence the
      # whole ldd closure is printed for the record but not gated on.
      # .cargo/config.toml names a target, so artifacts live under the triple
      # rather than straight in target/. Missing the binary is its own error:
      # readelf on a path that does not exist reads as a linkage failure
      # otherwise.
      - name: Assert the binary links no GTK stack
        run: |
          bin=target/x86_64-unknown-linux-gnu/debug/bnksound
          if [ ! -f "$bin" ]; then
            echo "::error::$bin not found, the build layout moved"
            exit 1
          fi
          needed=$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          if echo "$needed" | grep -Ei 'libgtk|libgdk|libglib|libgobject|libgio|libcairo|libpango'; then
            echo "::error::the native binary links part of the GTK stack"
            exit 1
          fi
          ldd "$bin"

  gtk:
    name: GTK shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features
