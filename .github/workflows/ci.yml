name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The toolchain is nightly and floats, so a lint that did not exist yesterday
  # can fail a build nobody touched. Monday morning is a better time to find
  # that than the moment a tag goes out.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # The shipping binary. GTK is deliberately not installed here: if anything in
  # the shared code starts reaching for the GTK stack, this job stops building,
  # which is the whole point of keeping the default feature set empty.
  native:
    name: Native (no GTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pipewire and libspa link against the PipeWire dev packages; libspa-sys
      # runs bindgen at build time, which needs libclang. Text and keyboard
      # handling link freetype, fontconfig, harfbuzz, and xkbcommon directly.
      # The emoji tests skip themselves when no colour emoji font is installed,
      # so fonts-noto-color-emoji is what makes them actually run here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            fonts-noto-color-emoji \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      # A GTK-free binary should link no GTK, GDK, GLib, or Pango of its own, so
      # check the artifact rather than trusting the feature flags. The test is
      # the binary's own DT_NEEDED list: those are the libraries bnksound asks
      # for. What those libraries then pull in is theirs to choose, and one of
      # them does pull GLib: HarfBuzz is built with GLib support on the usual
      # distributions, so libglib loads behind it whatever we ask for. Hence the
      # whole ldd closure is printed for the record but not gated on.
      # .cargo/config.toml names a target, so artifacts live under the triple
      # rather than straight in target/. Missing the binary is its own error:
      # readelf on a path that does not exist reads as a linkage failure
      # otherwise.
      - name: Assert the binary links no GTK stack
        run: |
          bin=target/x86_64-unknown-linux-gnu/debug/bnksound
          if [ ! -f "$bin" ]; then
            echo "::error::$bin not found, the build layout moved"
            exit 1
          fi
          needed=$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          if echo "$needed" | grep -Ei 'libgtk|libgdk|libglib|libgobject|libgio|libcairo|libpango'; then
            echo "::error::the native binary links part of the GTK stack"
            exit 1
          fi
          ldd "$bin"

  gtk:
    name: GTK shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

  # The Flatpak, built from the manifest that ships. Nothing else exercises
  # cargo-sources.json, so a dependency added without regenerating it surfaces
  # here and only here: the manifest builds with `cargo --offline --locked`,
  # which fails on a crate the vendored sources do not carry. Regenerate with
  # flatpak-cargo-generator.py against Cargo.lock when that happens.
  #
  # The image carries the tooling and the GNOME 50 runtime the manifest builds
  # against, so flatpak-builder only fetches the two SDK extensions from
  # Flathub. The container is privileged because bwrap needs user namespaces
  # the runner does not otherwise hand out.
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    # Longer than the cargo jobs: the SDK extensions download before any code
    # compiles, and the release profile links with LTO afterwards.
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.borgenk.BnkSound.yml
          bundle: bnksound.flatpak
          artifact-name: bnksound-flatpak-x86_64
          # The manifest copies the checkout in as a source and skips the two
          # names below, so the build cannot fold its own output back into the
          # app. The action's defaults (flatpak_app, repo) are not on that list.
          build-dir: build-dir
          repo-dir: flatpak-repo
          # The action's only restore-key is the literal prefix
          # "flatpak-builder-<arch>", so a key without it never falls back to
          # the previous run and every build re-downloads all of crates.io.
          cache-key: flatpak-builder-${{ github.sha }}

      # The manifest builds bnksound-gtk and installs it under the plain name,
      # so what the app holds is only visible in the binary's own linkage. The
      # undecorated build links no part of the GTK stack.
      - name: Verify the app holds the GTK build
        run: |
          if ! grep -aq 'libgtk-4\.so' build-dir/files/bin/bnksound; then
            echo "::error::the Flatpak's bnksound does not link GTK"
            exit 1
          fi

      # Flathub's linter, which the image already carries. Its rules are
      # Flathub's submission policy rather than a claim about whether the app
      # works, and a few of them land on choices made deliberately: the host
      # read access the row labels need, and being Wayland-only. Those are in
      # flatpak-lint-allowed.json with their reasons. Every other error fails,
      # and so does an accepted one that stopped being reported.
      #
      # The linter exits non-zero whenever it reports anything, so its own
      # status says only that the file has content.
      - name: Lint against Flathub's rules
        run: |
          out="${RUNNER_TEMP:-/tmp}"
          flatpak-builder-lint manifest io.github.borgenk.BnkSound.yml > "$out/lint-manifest.json" || true
          flatpak-builder-lint repo flatpak-repo > "$out/lint-repo.json" || true
          python3 .github/flatpak-lint-diff.py .github/flatpak-lint-allowed.json \
            "$out/lint-manifest.json" "$out/lint-repo.json"
