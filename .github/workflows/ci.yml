name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  native:
    name: Native (no GTK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            fonts-noto-color-emoji \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: make fmt-check

      - name: Test the installer and the ABI floor
        run: make test-install test-abi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Assert the binary links no GTK stack
        run: |
          bin=target/x86_64-unknown-linux-gnu/debug/bnksound
          if [ ! -f "$bin" ]; then
            echo "::error::$bin not found, the build layout moved"
            exit 1
          fi
          needed=$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          if echo "$needed" | grep -Ei 'libgtk|libgdk|libglib|libgobject|libgio|libcairo|libpango'; then
            echo "::error::the native binary links part of the GTK stack"
            exit 1
          fi
          ldd "$bin"

  gtk:
    name: GTK shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1fb2df10a57276f90806e1f35454048e30bf1855b7b4ff4808c9ee55887bd852 # gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkSound.yml
          bundle: bnksound.flatpak
          build-dir: build-dir
          repo-dir: flatpak-repo
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Verify the app holds the GTK build
        run: |
          if ! grep -aq 'libgtk-4\.so' build-dir/files/bin/bnksound; then
            echo "::error::the Flatpak's bnksound does not link GTK"
            exit 1
          fi

      - name: Lint against Flathub's rules
        run: |
          lint() { flatpak-builder-lint --exceptions \
            --user-exceptions .github/flatpak-lint-exceptions.json "$@"; }
          lint manifest io.github.borgenk.BnkSound.yml
          lint repo flatpak-repo
