name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag against Cargo.toml
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  gate:
    name: Gate
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            fonts-noto-color-emoji \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: make check

  flatpak:
    name: Flatpak bundle
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1fb2df10a57276f90806e1f35454048e30bf1855b7b4ff4808c9ee55887bd852 # gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.borgenk.BnkSound.yml
          bundle: bnksound-${{ github.ref_name }}-x86_64.flatpak
          # The manifest skips both names, so the build never copies its own
          # output back in.
          build-dir: build-dir
          repo-dir: flatpak-repo
          cache: false
          upload-artifact: false

      - name: Verify the bundle holds the GTK build
        run: |
          if ! grep -aq 'libgtk-4\.so' build-dir/files/bin/bnksound; then
            echo "::error::the Flatpak's bnksound does not link GTK"
            exit 1
          fi

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-bundle
          path: bnksound-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [gate, flatpak]
    runs-on: ubuntu-latest
    # Build inside Debian 12, so the binaries need no glibc newer than its 2.36.
    container: debian:12
    timeout-minutes: 30
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            make \
            pkg-config \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release tarballs
        run: make build-linux

      - name: Verify each archive holds the build it claims
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          target=x86_64-unknown-linux-gnu
          tar -xzf "dist/bnksound-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-gtk
          tar -xzf "dist/bnksound-undecorated-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-und
          needed_gtk=$(readelf -d /tmp/shipped-gtk | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          needed_und=$(readelf -d /tmp/shipped-und | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "gtk: $needed_gtk"
          echo "undecorated: $needed_und"
          if ! echo "$needed_gtk" | grep -q '^libgtk-4'; then
            echo "::error::the GTK archive's bnksound does not link GTK"
            exit 1
          fi
          if echo "$needed_und" | grep -qE '^lib(gtk|gdk|glib|gio|gobject|cairo|pango|gdk_pixbuf)'; then
            echo "::error::the undecorated archive's bnksound links the GTK stack"
            exit 1
          fi

      - name: Collect the Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-bundle
          path: dist

      - name: Checksum the Flatpak bundle
        run: |
          cd dist
          for bundle in *.flatpak; do
            sha256sum "$bundle" > "$bundle.sha256"
          done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
