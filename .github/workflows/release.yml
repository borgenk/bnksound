name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release tarballs are named from the Cargo.toml version, and install.sh
  # fetches them by the release tag. A mismatch would publish assets the
  # installer cannot find, so both build jobs wait on this one rather than
  # finding out after a Flatpak build.
  version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag against Cargo.toml
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  # The Flatpak bundle, from the manifest CI builds on every push. A job of its
  # own for the flatpak tooling and the GNOME runtime the image carries. The
  # container is privileged because bwrap needs user namespaces the runner does
  # not otherwise hand out.
  flatpak:
    name: Flatpak bundle
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.borgenk.BnkSound.yml
          bundle: bnksound-${{ github.ref_name }}-x86_64.flatpak
          # The manifest copies the checkout in as a source and skips the two
          # names below, so the build cannot fold its own output back into the
          # app. The action's defaults (flatpak_app, repo) are not on that list.
          build-dir: build-dir
          repo-dir: flatpak-repo
          # What ships is built from the checkout and nothing else.
          cache: false
          # The action derives its artifact name from the bundle name. The
          # bundle goes up below instead, under a name the publish job can ask
          # for without knowing how the bundle is named.
          upload-artifact: false

      # The tarballs get the same treatment further down, and for the same
      # reason: the binary is installed under the plain name, so its own
      # linkage is what says which of the two builds is inside.
      - name: Verify the bundle holds the GTK build
        run: |
          if ! grep -aq 'libgtk-4\.so' build-dir/files/bin/bnksound; then
            echo "::error::the Flatpak's bnksound does not link GTK"
            exit 1
          fi

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@v5
        with:
          name: flatpak-bundle
          path: bnksound-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [version, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both variants are built here, so this is the union of what each needs:
      # the GTK packages for the binary that ships, the rest for both.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      # Nightly, with the standard library source: rust-toolchain.toml pins the
      # channel and .cargo/config.toml builds std from source with the app.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # One archive per variant, each holding its binary as bnksound.
      - name: Build release tarballs
        run: make build-linux

      # install.sh picks an archive by name and trusts the binary inside it, so
      # check that each archive holds the build its name claims. The GTK one
      # must link GTK, the undecorated one must link no part of that stack.
      - name: Verify each archive holds the build it claims
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          target=x86_64-unknown-linux-gnu
          tar -xzf "dist/bnksound-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-gtk
          tar -xzf "dist/bnksound-undecorated-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-und
          needed_gtk=$(readelf -d /tmp/shipped-gtk | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          needed_und=$(readelf -d /tmp/shipped-und | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "gtk: $needed_gtk"
          echo "undecorated: $needed_und"
          if ! echo "$needed_gtk" | grep -q '^libgtk-4'; then
            echo "::error::the GTK archive's bnksound does not link GTK"
            exit 1
          fi
          if echo "$needed_und" | grep -qE '^lib(gtk|gdk|glib|gio|gobject|cairo|pango|gdk_pixbuf)'; then
            echo "::error::the undecorated archive's bnksound links the GTK stack"
            exit 1
          fi

      # Built in the job above, which needs a container the tarballs do not.
      - name: Collect the Flatpak bundle
        uses: actions/download-artifact@v5
        with:
          name: flatpak-bundle
          path: dist

      # make build-linux writes one of these per tarball; the bundle arrives
      # without one.
      - name: Checksum the Flatpak bundle
        run: |
          cd dist
          for bundle in *.flatpak; do
            sha256sum "$bundle" > "$bundle.sha256"
          done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
