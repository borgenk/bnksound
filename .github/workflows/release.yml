name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The release tarball is named from the Cargo.toml version, and
      # install.sh fetches it by the release tag. A mismatch would publish
      # an asset the installer cannot find, so fail fast before building.
      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      # Both variants are built here, so this is the union of what each needs:
      # the GTK packages for the binary that ships, the rest for both.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      # Nightly, with the standard library source: rust-toolchain.toml pins the
      # channel and .cargo/config.toml builds std from source with the app.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # One archive per variant, each holding its binary as bnksound.
      - name: Build release tarballs
        run: make build-linux

      # install.sh picks an archive by name and trusts the binary inside it, so
      # check that each archive holds the build its name claims. The GTK one
      # must link GTK, the undecorated one must link no part of that stack.
      - name: Verify each archive holds the build it claims
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          target=x86_64-unknown-linux-gnu
          tar -xzf "dist/bnksound-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-gtk
          tar -xzf "dist/bnksound-undecorated-v$version-$target.tar.gz" -O ./bnksound > /tmp/shipped-und
          needed_gtk=$(readelf -d /tmp/shipped-gtk | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          needed_und=$(readelf -d /tmp/shipped-und | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "gtk: $needed_gtk"
          echo "undecorated: $needed_und"
          if ! echo "$needed_gtk" | grep -q '^libgtk-4'; then
            echo "::error::the GTK archive's bnksound does not link GTK"
            exit 1
          fi
          if echo "$needed_und" | grep -qE '^lib(gtk|gdk|glib|gio|gobject|cairo|pango|gdk_pixbuf)'; then
            echo "::error::the undecorated archive's bnksound links the GTK stack"
            exit 1
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
