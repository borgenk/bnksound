name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The release tarball is named from the Cargo.toml version, and
      # install.sh fetches it by the release tag. A mismatch would publish
      # an asset the installer cannot find, so fail fast before building.
      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      # Both variants are built here, so this is the union of what each needs:
      # the GTK packages for the binary that ships, the rest for both.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The tarball holds the GTK build under the name bnksound. The native one
      # is built too but not published: a tag should not be the moment we find
      # out it stopped compiling.
      - name: Build the native binary
        run: cargo build --release --bin bnksound

      - name: Build release tarball
        run: make build-linux

      # The published binary is the GTK one whatever the file is called, so
      # check the artifact says so before it goes out.
      - name: Verify the tarball holds the GTK build
        run: |
          tar -xzf dist/*.tar.gz -O ./bnksound > /tmp/shipped
          chmod +x /tmp/shipped
          needed=$(readelf -d /tmp/shipped | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "$needed"
          echo "$needed" | grep -q '^libgtk-4' || {
            echo "::error::the tarball's bnksound does not link GTK"
            exit 1
          }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
