name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The release tarball is named from the Cargo.toml version, and
      # install.sh fetches it by the release tag. A mismatch would publish
      # an asset the installer cannot find, so fail fast before building.
      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      # Both variants are built here, so this is the union of what each needs:
      # the GTK packages for the binary that ships, the rest for both.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            clang \
            libclang-dev

      # Nightly, with the standard library source: rust-toolchain.toml pins the
      # channel and .cargo/config.toml builds std from source with the app.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Builds both binaries and stages them: bnksound is the GTK build,
      # bnksound-undecorated the one with no decorations and no GTK.
      - name: Build release tarball
        run: make build-linux

      # install.sh picks a file out of the tarball by name, so check that each
      # name holds the build it claims before the release goes out. The GTK one
      # must link GTK, and the native one must link no part of the GTK stack.
      - name: Verify both builds in the tarball
        run: |
          tar -xzf dist/*.tar.gz -O ./bnksound > /tmp/shipped-gtk
          tar -xzf dist/*.tar.gz -O ./bnksound-undecorated > /tmp/shipped-native
          needed_gtk=$(readelf -d /tmp/shipped-gtk | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          needed_native=$(readelf -d /tmp/shipped-native | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "gtk: $needed_gtk"
          echo "native: $needed_native"
          if ! echo "$needed_gtk" | grep -q '^libgtk-4'; then
            echo "::error::the tarball's bnksound does not link GTK"
            exit 1
          fi
          if echo "$needed_native" | grep -qE '^lib(gtk|gdk|glib|gio|gobject|cairo|pango|gdk_pixbuf)'; then
            echo "::error::the tarball's bnksound-undecorated links the GTK stack"
            exit 1
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
